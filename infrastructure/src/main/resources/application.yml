server:
  port: ${application.server.port}
spring:
  profiles:
    active:
      - spring-cloud
      - ${application.vendor.database}

application:
  name: drive-api
  server:
    context-path: /api/drive
    port: ${DRIVE_SERVER_PORT:8080}
  vendor:
    database: ${DRIVE_VENDOR_DATABASE:postgres} # h2 | postgres